name: Deploy SPACE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Pages files
        run: python3 scripts/test_pages.py
      - name: Validate GPU deployment package
        run: python3 scripts/test_space.py
      - name: Validate automatic GPU connection
        run: node scripts/test_backend.mjs
      - name: Check browser script syntax
        run: node --input-type=module --check < app.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        env:
          PAGES_REPOSITORY: ${{ github.repository }}
          PAGES_VIEWER_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_REF: ${{ github.ref_name }}
        run: python3 scripts/build_pages.py --repository "$PAGES_REPOSITORY" --viewer-url "$PAGES_VIEWER_URL" --ref "$PAGES_REF"
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
